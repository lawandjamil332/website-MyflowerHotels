<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="My Flower Hotels">
  <title>My Flower Hotels</title>
  <rect width="64" height="64" rx="12" fill="#0f2f4a"/>
  <!-- Six petals around a centre, drawn rather than lettered: at 16px a
       monogram turns to mush, while a simple radial shape stays legible. -->
  <g fill="#b08d4f">
    <ellipse cx="32" cy="20" rx="6" ry="9"/>
    <ellipse cx="32" cy="44" rx="6" ry="9"/>
    <ellipse cx="32" cy="32" rx="6" ry="9" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="6" ry="9" transform="rotate(-60 32 32)"/>
    <ellipse cx="32" cy="32" rx="6" ry="9" transform="rotate(120 32 32)"/>
    <ellipse cx="32" cy="32" rx="6" ry="9" transform="rotate(-120 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="5" fill="#f1ede4"/>
</svg>
