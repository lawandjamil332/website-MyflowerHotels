# Chromium, so the booking confirmation can be a real PDF.
#
# The confirmation is produced by printing the booking pass page in a headless
# browser. That is not a shortcut — it is the only way to get Kurdish and Arabic
# right. Both join their letters and both run right to left, and a PDF library
# places glyphs without shaping or reordering them: fed a Kurdish hotel name it
# writes disconnected letters backwards. A browser already does it correctly on
# the page the guest is looking at, so the document is that page, printed.
#
# Without this file the site still runs and still sends both confirmation
# emails — `renderBookingPdf` finds no browser, says so in the log once, and the
# letters go out carrying the link they always did. Nothing breaks; the
# attachment simply is not there.
#
# The fonts are not optional either. A container with no Arabic font prints a
# page of empty boxes, which is the failure that looks like a broken document
# rather than a missing one. `noto-fonts` carries the Arabic script, which is
# what both Kurdish and Arabic are written in here.
#
# Chinese, Japanese and Korean are deliberately not installed. This site is
# written in three languages and none of them is one of those; the CJK package
# is several hundred megabytes, it is the one name in this list that has been
# renamed between nixpkgs releases, and a name that does not resolve fails the
# whole build — which serves the previous deployment and looks, from an inbox,
# exactly like the attachment quietly not working.
[phases.setup]
nixPkgs = ["...", "chromium", "noto-fonts", "noto-fonts-emoji"]

[variables]
# Stops npm's postinstall fetching a second browser over the one installed
# above. Nix puts chromium on PATH rather than at a fixed address, so nothing
# here names its location — `findBrowser` in src/utilities/bookingPdf.ts walks
# PATH for exactly that reason.
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
